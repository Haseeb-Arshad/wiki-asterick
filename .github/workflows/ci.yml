name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Starts the built app and drives it in Chrome. Needs no internet.
      - run: npm run smoke

  live-smoke:
    name: Smoke test with live Wikipedia
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Wikipedia can be slow or limit a shared runner. This reports a problem without blocking a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke -- --live
